name: Repository Dispatch
description: >
  Trigger a repository_dispatch event on a target repository.

inputs:
  target_repo:
    description: "Target repository to dispatch to (e.g. org/homebrew-tap)"
    required: true
  event_type:
    description: "The event_type for the repository_dispatch event"
    required: true
  token:
    description: "PAT with Contents (Read and write) permission on the target repository. Fine-grained PAT: Repository permissions > Contents > Read and write"
    required: true
  payload:
    description: "JSON object string to set as client_payload"
    required: false
    default: "{}"

runs:
  using: composite
  steps:
    - name: Dispatch repository_dispatch
      shell: bash
      run: |
        BODY=$(jq -n \
          --arg event_type "${{ inputs.event_type }}" \
          --argjson payload '${{ inputs.payload }}' \
          '{event_type: $event_type, client_payload: $payload}')

        HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
          -X POST \
          -H "Authorization: Bearer ${{ inputs.token }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ inputs.target_repo }}/dispatches" \
          -d "$BODY")

        if [[ "$HTTP_STATUS" != "204" ]]; then
          echo "Dispatch failed with HTTP $HTTP_STATUS" >&2
          exit 1
        fi

        echo "Dispatched '${{ inputs.event_type }}' to ${{ inputs.target_repo }}"